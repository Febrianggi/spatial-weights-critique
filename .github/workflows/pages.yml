# Publishes the landing page, the knitted report and the dashboard to GitHub Pages.
# One-time setup in the repository: Settings > Pages > Build and deployment > Source: GitHub Actions.
# The site is not rebuilt from R here: it uses the committed reports/ and dashboard_html/index.html,
# so knit Columbus_Spatial_Analysis.Rmd locally and commit the results before pushing.
name: Deploy website to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Check dashboard numbers against the CSV results
        run: python tests/test_html_dashboard.py . tests/screenshots

      - name: Build the site and check every link under the repository subpath
        env:
          SITE_SUBPATH: ${{ github.event.repository.name }}
        run: python tests/check_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
